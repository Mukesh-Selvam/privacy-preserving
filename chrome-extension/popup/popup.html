<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Gateway</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ── LOGIN SCREEN ─────────────────────────────────────── -->
<div id="screen-login" class="screen active">
  <div class="login-header">
    <div class="logo-ring">
      <svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4L8 11v12c0 9.75 6.8 18.87 16 21 9.2-2.13 16-11.25 16-21V11L24 4z" fill="url(#shield-grad)" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="24" cy="22" r="5" fill="#0a0f1e" stroke="#06b6d4" stroke-width="1.5"/>
        <rect x="21" y="26" width="6" height="7" rx="2" fill="#06b6d4"/>
        <defs>
          <linearGradient id="shield-grad" x1="8" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1e1b4b"/>
            <stop offset="1" stop-color="#0c1a3a"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="login-titles">
      <h1>Privacy Gateway</h1>
      <p>Patient Data Portal</p>
    </div>
  </div>

  <form id="login-form" class="login-form">
    <div class="form-group">
      <label for="input-api-url">API Base URL</label>
      <input id="input-api-url" type="url" placeholder="http://localhost:8080" autocomplete="url" />
    </div>
    <div class="form-group">
      <label for="input-api-key">API Key</label>
      <input id="input-api-key" type="password" placeholder="X-API-Key value" autocomplete="current-password" />
    </div>
    <div class="form-group">
      <label for="input-patient-id">Patient ID</label>
      <input id="input-patient-id" type="number" placeholder="e.g. 1" min="1" />
    </div>
    <div id="login-error" class="error-msg hidden"></div>
    <button type="submit" id="btn-login" class="btn btn-primary btn-full">
      <span class="btn-text">Connect</span>
      <span class="btn-spinner hidden"></span>
    </button>
  </form>

  <p class="login-footer">
    <a href="#" id="link-options">Configure Settings</a>
  </p>
</div>

<!-- ── MAIN DASHBOARD ────────────────────────────────────── -->
<div id="screen-main" class="screen hidden">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path d="M12 2L3 6v6c0 5 3.4 9.4 9 10.5C17.6 21.4 21 17 21 12V6L12 2z" fill="url(#topShield)" stroke="#06b6d4" stroke-width="1.2"/>
        <defs><linearGradient id="topShield" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#0c1a3a"/></linearGradient></defs>
      </svg>
      <span class="topbar-name">Privacy Gateway</span>
    </div>
    <div class="topbar-right">
      <span id="patient-badge" class="patient-badge"></span>
      <button id="btn-logout" class="icon-btn" title="Logout">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M13 3h4a1 1 0 011 1v12a1 1 0 01-1 1h-4M8 7l-4 3 4 3M4 10h9"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="consent">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
      Consent
    </button>
    <button class="tab-btn" data-tab="preview">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      Live Preview
    </button>
    <button class="tab-btn" data-tab="audit">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Audit Log
    </button>
  </div>

  <!-- ── CONSENT TAB ── -->
  <div id="tab-consent" class="tab-panel active">
    <div class="tab-header">
      <p class="tab-desc">Control which data fields organizations can access. Toggle off to revoke access immediately.</p>
    </div>
    <div id="consent-list" class="consent-list">
      <!-- dynamically populated -->
    </div>
    <div id="consent-toast" class="toast hidden"></div>
  </div>

  <!-- ── LIVE PREVIEW TAB ── -->
  <div id="tab-preview" class="tab-panel hidden">
    <div class="tab-header">
      <label for="preview-org" class="label-sm">View as organization</label>
      <select id="preview-org" class="select-org">
        <option value="insurer-partner">insurer-partner</option>
        <option value="research-institute">research-institute</option>
        <option value="pharmacy-chain">pharmacy-chain</option>
      </select>
    </div>
    <div id="preview-result" class="preview-result">
      <div class="preview-placeholder">
        <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#334155" stroke-width="2"><circle cx="24" cy="20" r="8"/><path d="M8 40c0-8.837 7.163-16 16-16s16 7.163 16 16"/></svg>
        <p>Select an organization to see what they can access</p>
      </div>
    </div>
    <button id="btn-refresh-preview" class="btn btn-secondary btn-full" style="margin-top:12px">
      Refresh Preview
    </button>
  </div>

  <!-- ── AUDIT LOG TAB ── -->
  <div id="tab-audit" class="tab-panel hidden">
    <div class="tab-header">
      <p class="tab-desc">Recent data access events for your record.</p>
    </div>
    <div id="audit-list" class="audit-list">
      <!-- dynamically populated -->
    </div>
    <div class="audit-footer">
      <button id="btn-load-more" class="btn btn-ghost btn-sm">Load more</button>
    </div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
