services:
  postgres:
    image: postgres:14.9
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    # published port on host -> container
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis
    container_name: gateway-redis
    ports:
      - "6380:6379"

  vault:
    image: hashicorp/vault
    container_name: gateway-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
    ports:
      - "8201:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev

  opa:
    image: openpolicyagent/opa
    container_name: gateway-opa
    ports:
      - "8182:8181"
    volumes:
      - ./policies:/policies
    command: run --server --addr=0.0.0.0:8181 /policies/gateway.rego

volumes:
  pgdata:
